{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Clientes</h1>
<div id="msg" class="msg alert" style="display:none;" role="alert"></div>
<div class="card">
  <div class="card-body">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
      <input type="text" id="clients-search" class="form-control form-control-sm" style="max-width:200px" placeholder="Buscar..." oninput="loadClients()">
      <button type="button" class="btn btn-sm btn-primary" onclick="openClientForm()">Nuevo</button>
    </div>
    <div id="clients-loading" class="text-center text-muted py-4">Cargando...</div>
    <div id="clients-content" style="display:none;"></div>
  </div>
</div>

<div id="modal-client" class="modal-overlay" onclick="if(event.target===this) modalHide('modal-client')">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-client-title">Nuevo cliente</h5></div>
      <form id="form-client" onsubmit="saveClient(event)">
        <div class="modal-body">
          <input type="hidden" id="client-id" value="">
          <div class="mb-3">
            <label class="form-label">Nombre *</label>
            <input type="text" id="client-name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Cédula / RUC</label>
            <input type="text" id="client-tax-id" class="form-control" placeholder="Identificación fiscal">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="client-email" class="form-control" placeholder="correo@ejemplo.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" id="client-phone" class="form-control" placeholder="Ej. 300 123 4567">
          </div>
          <div class="mb-3">
            <label class="form-label">Dirección</label>
            <textarea id="client-address" class="form-control" rows="2" placeholder="Dirección completa"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Notas</label>
            <textarea id="client-notes" class="form-control" rows="2"></textarea>
          </div>
          <div class="form-check">
            <input type="checkbox" id="client-active" class="form-check-input" checked>
            <label class="form-check-label" for="client-active">Activo</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="modalHide('modal-client')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
var API_CLIENTS = "{{ url_for('clients.list_clients') }}";
const msg = document.getElementById('msg');
var clientsList = [];

function loadClients() {
  document.getElementById('clients-loading').style.display = 'block';
  document.getElementById('clients-content').style.display = 'none';
  var q = (document.getElementById('clients-search') && document.getElementById('clients-search').value) || '';
  var url = API_CLIENTS + (q.trim() ? '?q=' + encodeURIComponent(q.trim()) : '');
  apiGet(url)
    .then(data => {
      document.getElementById('clients-loading').style.display = 'none';
      document.getElementById('clients-content').style.display = 'block';
      clientsList = data || [];
      if (clientsList.length === 0) {
        document.getElementById('clients-content').innerHTML = '<p>No hay clientes. Añade uno con "Nuevo cliente".</p>';
        return;
      }
      let html = '<div class="table-responsive"><table class="table table-striped table-hover"><thead><tr><th>Nombre</th><th>Cédula/RUC</th><th>Email</th><th>Teléfono</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody>';
      clientsList.forEach(c => {
        html += '<tr><td>' + (c.name || '') + '</td><td>' + (c.tax_id || '-') + '</td><td>' + (c.email || '-') + '</td><td>' + (c.phone || '-') + '</td><td>' + (c.active ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Inactivo</span>') + '</td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-secondary" onclick="editClient(' + c.id + ')">Editar</button> <button type="button" class="btn btn-sm btn-outline-danger" onclick="delClient(' + c.id + ')">Eliminar</button></td></tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('clients-content').innerHTML = html;
    })
    .catch(e => { document.getElementById('clients-loading').style.display = 'none'; showMsg(msg, 'Error: ' + e.message, 'error'); });
}

function openClientForm() {
  document.getElementById('modal-client-title').textContent = 'Nuevo cliente';
  document.getElementById('client-id').value = '';
  document.getElementById('client-name').value = '';
  document.getElementById('client-tax-id').value = '';
  document.getElementById('client-email').value = '';
  document.getElementById('client-phone').value = '';
  document.getElementById('client-address').value = '';
  document.getElementById('client-notes').value = '';
  document.getElementById('client-active').checked = true;
  modalShow('modal-client');
}

function editClient(id) {
  apiGet(API_CLIENTS.replace(/\/$/, '') + '/' + id).then(c => {
    document.getElementById('modal-client-title').textContent = 'Editar cliente';
    document.getElementById('client-id').value = c.id;
    document.getElementById('client-name').value = c.name || '';
    document.getElementById('client-tax-id').value = c.tax_id || '';
    document.getElementById('client-email').value = c.email || '';
    document.getElementById('client-phone').value = c.phone || '';
    document.getElementById('client-address').value = c.address || '';
    document.getElementById('client-notes').value = c.notes || '';
    document.getElementById('client-active').checked = c.active !== false;
    modalShow('modal-client');
  }).catch(err => showMsg(msg, err.message, 'error'));
}

function saveClient(e) {
  e.preventDefault();
  var id = document.getElementById('client-id').value;
  var data = {
    name: document.getElementById('client-name').value.trim(),
    tax_id: document.getElementById('client-tax-id').value.trim() || null,
    email: document.getElementById('client-email').value.trim() || null,
    phone: document.getElementById('client-phone').value.trim() || null,
    address: document.getElementById('client-address').value.trim() || null,
    notes: document.getElementById('client-notes').value.trim() || null,
    active: document.getElementById('client-active').checked
  };
  if (!data.name) { showMsg(msg, 'El nombre es obligatorio.', 'error'); return; }
  var url = id ? API_CLIENTS.replace(/\/$/, '') + '/' + id : API_CLIENTS;
  var p = id ? apiPut(url, data) : apiPost(API_CLIENTS, data);
  p.then(() => { modalHide('modal-client'); showMsg(msg, 'Cliente guardado.', 'success'); loadClients(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}

function delClient(id) {
  var c = clientsList.find(x => x.id === id);
  var name = c ? (c.name || '') : ('ID ' + id);
  if (!confirm('¿Desactivar el cliente "' + name + '"?')) return;
  apiDelete(API_CLIENTS.replace(/\/$/, '') + '/' + id)
    .then(() => { showMsg(msg, 'Cliente desactivado.', 'success'); loadClients(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}

loadClients();
</script>
{% endblock %}
