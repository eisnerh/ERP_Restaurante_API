{% extends "base.html" %}
{% block title %}Compras{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Compras</h1>
<div id="msg" class="msg alert" style="display:none;" role="alert"></div>
<div class="card">
  <div class="card-body">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
      <select id="filter-status" class="form-select form-select-sm" style="max-width:120px" onchange="loadOrders()">
        <option value="">Todos</option>
        <option value="draft">Borrador</option>
        <option value="sent">Enviada</option>
        <option value="received">Recibida</option>
        <option value="cancelled">Cancelada</option>
      </select>
      <button type="button" class="btn btn-sm btn-primary" onclick="openOrderForm()">Nueva orden</button>
    </div>
    <div id="orders-loading" class="text-center text-muted py-4">Cargando...</div>
    <div id="orders-content" style="display:none;"></div>
  </div>
</div>

<div id="modal-order" class="modal-overlay" onclick="if(event.target===this) modalHide('modal-order')">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-order-title">Nueva orden de compra</h5></div>
      <form id="form-order" onsubmit="saveOrder(event)">
        <div class="modal-body">
          <input type="hidden" id="order-id" value="">
          <div class="mb-3">
            <label class="form-label">Proveedor *</label>
            <select id="order-supplier" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Notas</label>
            <textarea id="order-notes" class="form-control" rows="2"></textarea>
          </div>
          <h6 class="mt-3">Ítems</h6>
          <div id="order-items-container">
            <div class="order-item-row mb-2 d-flex gap-2 align-items-end">
              <input type="text" class="form-control" placeholder="Producto" name="product_name">
              <input type="number" class="form-control" style="width:90px;" placeholder="Cant." name="quantity" value="1" min="0.01" step="0.01">
              <input type="text" class="form-control" style="width:70px;" placeholder="UM" name="unit" value="UND">
              <input type="number" class="form-control" style="width:100px;" placeholder="P. unit." name="unit_price" value="0" min="0" step="0.01">
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeItemRow(this)">-</button>
            </div>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="addItemRow()">+ Añadir ítem</button>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="modalHide('modal-order')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
var API_PURCHASES = "{{ url_for('purchases.list_orders') }}";
var API_PURCHASES_SUPPLIERS = "{{ url_for('purchases.list_suppliers') }}";
const msg = document.getElementById('msg');
var ordersList = [];
var suppliersList = [];

function loadOrders() {
  document.getElementById('orders-loading').style.display = 'block';
  document.getElementById('orders-content').style.display = 'none';
  var status = document.getElementById('filter-status') && document.getElementById('filter-status').value;
  var url = API_PURCHASES + (status ? '?status=' + encodeURIComponent(status) : '');
  apiGet(url)
    .then(data => {
      document.getElementById('orders-loading').style.display = 'none';
      document.getElementById('orders-content').style.display = 'block';
      ordersList = data || [];
      if (ordersList.length === 0) {
        document.getElementById('orders-content').innerHTML = '<p>No hay órdenes de compra. Crea una con "Nueva orden".</p>';
        return;
      }
      let html = '<div class="table-responsive"><table class="table table-striped table-hover"><thead><tr><th>Nº</th><th>Proveedor</th><th>Fecha</th><th>Total</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody>';
      ordersList.forEach(o => {
        var statusBadge = o.status === 'draft' ? 'secondary' : o.status === 'received' ? 'success' : o.status === 'cancelled' ? 'danger' : 'info';
        html += '<tr><td>' + (o.order_number || o.id) + '</td><td>' + (o.supplier ? o.supplier.name : '-') + '</td><td>' + (o.order_date ? new Date(o.order_date).toLocaleDateString() : '-') + '</td><td>' + (o.total != null ? parseFloat(o.total).toFixed(2) : '0.00') + '</td><td><span class="badge bg-' + statusBadge + '">' + (o.status || 'draft') + '</span></td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-secondary" onclick="viewOrder(' + o.id + ')">Ver</button></td></tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('orders-content').innerHTML = html;
    })
    .catch(e => { document.getElementById('orders-loading').style.display = 'none'; showMsg(msg, 'Error: ' + e.message, 'error'); });
}

function loadSuppliers() {
  return apiGet(API_PURCHASES_SUPPLIERS).then(data => {
    suppliersList = data || [];
    var sel = document.getElementById('order-supplier');
    if (!sel) return;
    sel.innerHTML = '<option value="">-- Seleccionar proveedor --</option>';
    suppliersList.forEach(s => {
      sel.innerHTML += '<option value="' + s.id + '">' + (s.name || '') + '</option>';
    });
  });
}

function addItemRow() {
  var container = document.getElementById('order-items-container');
  var row = document.createElement('div');
  row.className = 'order-item-row mb-2 d-flex gap-2 align-items-end';
  row.innerHTML = '<input type="text" class="form-control" placeholder="Producto" name="product_name">' +
    '<input type="number" class="form-control" style="width:90px;" placeholder="Cant." name="quantity" value="1" min="0.01" step="0.01">' +
    '<input type="text" class="form-control" style="width:70px;" placeholder="UM" name="unit" value="UND">' +
    '<input type="number" class="form-control" style="width:100px;" placeholder="P. unit." name="unit_price" value="0" min="0" step="0.01">' +
    '<button type="button" class="btn btn-outline-danger btn-sm" onclick="removeItemRow(this)">-</button>';
  container.appendChild(row);
}

function removeItemRow(btn) {
  var rows = document.querySelectorAll('.order-item-row');
  if (rows.length > 1) btn.closest('.order-item-row').remove();
}

function openOrderForm() {
  document.getElementById('modal-order-title').textContent = 'Nueva orden de compra';
  document.getElementById('order-id').value = '';
  document.getElementById('order-notes').value = '';
  loadSuppliers().then(() => {
    document.getElementById('order-supplier').value = '';
    var container = document.getElementById('order-items-container');
    container.innerHTML = '';
    addItemRow();
    modalShow('modal-order');
  });
}

function viewOrder(id) {
  apiGet(API_PURCHASES.replace(/\/$/, '') + '/' + id).then(o => {
    alert('Orden: ' + (o.order_number || o.id) + '\nProveedor: ' + (o.supplier ? o.supplier.name : '-') + '\nTotal: ' + (o.total || 0) + '\nEstado: ' + (o.status || 'draft') + '\n\nÍtems: ' + (o.items ? o.items.length : 0));
  }).catch(err => showMsg(msg, err.message, 'error'));
}

function getOrderItemsData() {
  var rows = document.querySelectorAll('.order-item-row');
  var items = [];
  rows.forEach(row => {
    var product = row.querySelector('[name="product_name"]').value.trim();
    var qty = parseFloat(row.querySelector('[name="quantity"]').value) || 0;
    if (product && qty > 0) {
      items.push({
        product_name: product,
        quantity: qty,
        unit: (row.querySelector('[name="unit"]').value || 'UND').trim(),
        unit_price: parseFloat(row.querySelector('[name="unit_price"]').value) || 0
      });
    }
  });
  return items;
}

function saveOrder(e) {
  e.preventDefault();
  var id = document.getElementById('order-id').value;
  var supplierId = document.getElementById('order-supplier').value;
  var items = getOrderItemsData();
  if (!supplierId) { showMsg(msg, 'Selecciona un proveedor.', 'error'); return; }
  if (items.length === 0) { showMsg(msg, 'Añade al menos un ítem.', 'error'); return; }
  var data = { supplier_id: parseInt(supplierId, 10), items: items, notes: document.getElementById('order-notes').value.trim() || null };
  apiPost(API_PURCHASES, data)
    .then(() => { modalHide('modal-order'); showMsg(msg, 'Orden creada.', 'success'); loadOrders(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}

loadSuppliers();
loadOrders();
</script>
{% endblock %}
