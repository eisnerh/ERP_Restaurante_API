{% extends "base.html" %}
{% block title %}Menú{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Menú</h1>
<div id="msg" class="msg alert" style="display:none;" role="alert"></div>

<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="card-title mb-0">Categorías</h5>
      <button type="button" class="btn btn-sm btn-primary" onclick="openCatForm()">Nueva</button>
    </div>
    <div id="cat-loading" class="text-center text-muted py-4">Cargando...</div>
    <div id="cat-content" style="display:none;"></div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="card-title mb-0">Platos</h5>
      <button type="button" class="btn btn-sm btn-primary" onclick="openDishForm()">Nuevo</button>
    </div>
    <div id="dish-loading" class="text-center text-muted py-4">Cargando...</div>
    <div id="dish-content" style="display:none;"></div>
  </div>
</div>

<!-- Modal categoría -->
<div id="modal-cat" class="modal-overlay" onclick="if(event.target===this) modalHide('modal-cat')">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-cat-title">Nueva categoría</h5></div>
      <form id="form-cat" onsubmit="saveCat(event)">
        <div class="modal-body">
          <input type="hidden" id="cat-id" value="">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="cat-name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" id="cat-description" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="modalHide('modal-cat')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal plato -->
<div id="modal-dish" class="modal-overlay" onclick="if(event.target===this) modalHide('modal-dish')">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-dish-title">Nuevo plato</h5></div>
      <form id="form-dish" onsubmit="saveDish(event)">
        <div class="modal-body">
          <input type="hidden" id="dish-id" value="">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="dish-name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" id="dish-description" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Precio (₡)</label>
            <input type="number" id="dish-price" class="form-control" step="0.01" min="0" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select id="dish-category-id" class="form-select" required></select>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" id="dish-available" class="form-check-input" checked>
            <label class="form-check-label" for="dish-available">Disponible</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="modalHide('modal-dish')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
const msg = document.getElementById('msg');
let categories = [];

function loadCategories() {
  document.getElementById('cat-loading').style.display = 'block';
  document.getElementById('cat-content').style.display = 'none';
  apiGet('/api/menu/categories')
    .then(data => {
      categories = data || [];
      document.getElementById('cat-loading').style.display = 'none';
      document.getElementById('cat-content').style.display = 'block';
      let html = '<div class="table-responsive"><table class="table table-striped table-hover"><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th class="text-end">Acciones</th></tr></thead><tbody>';
      categories.forEach(c => {
        html += '<tr><td>' + c.id + '</td><td>' + (c.name || '') + '</td><td>' + (c.description || '-') + '</td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-secondary" onclick="editCat(' + c.id + ')">Editar</button> <button type="button" class="btn btn-sm btn-outline-secondary" onclick="delCat(' + c.id + ',\'' + (c.name || '').replace(/'/g, "\\'") + '\')">Eliminar</button></td></tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('cat-content').innerHTML = html || '<p>No hay categorías.</p>';
    })
    .catch(e => { document.getElementById('cat-loading').style.display = 'none'; showMsg(msg, 'Error: ' + e.message, 'error'); });
}

function loadDishes() {
  document.getElementById('dish-loading').style.display = 'block';
  document.getElementById('dish-content').style.display = 'none';
  apiGet('/api/menu/dishes')
    .then(data => {
      document.getElementById('dish-loading').style.display = 'none';
      document.getElementById('dish-content').style.display = 'block';
      const list = data || [];
      let html = '<div class="table-responsive"><table class="table table-striped table-hover"><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th class="text-end">Precio</th><th>Disponible</th><th class="text-end">Acciones</th></tr></thead><tbody>';
      list.forEach(d => {
        const cat = categories.find(c => c.id === d.category_id);
        html += '<tr><td>' + d.id + '</td><td>' + (d.name || '') + '</td><td>' + (d.description || '-') + '</td><td class="text-end">' + (d.price != null ? '₡ ' + Number(d.price).toLocaleString() : '-') + '</td><td>' + (d.available ? 'Sí' : 'No') + '</td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-secondary" onclick="editDish(' + d.id + ')">Editar</button> <button type="button" class="btn btn-sm btn-outline-secondary" onclick="delDish(' + d.id + ')">Eliminar</button></td></tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('dish-content').innerHTML = html || '<p>No hay platos.</p>';
      fillCategorySelect();
    })
    .catch(e => { document.getElementById('dish-loading').style.display = 'none'; showMsg(msg, 'Error: ' + e.message, 'error'); });
}

function fillCategorySelect() {
  const sel = document.getElementById('dish-category-id');
  sel.innerHTML = '<option value="">-- Categoría --</option>';
  categories.forEach(c => { sel.innerHTML += '<option value="' + c.id + '">' + (c.name || '') + '</option>'; });
}

function openCatForm() {
  document.getElementById('modal-cat-title').textContent = 'Nueva categoría';
  document.getElementById('cat-id').value = '';
  document.getElementById('cat-name').value = '';
  document.getElementById('cat-description').value = '';
  modalShow('modal-cat');
}
function editCat(id) {
  const c = categories.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-cat-title').textContent = 'Editar categoría';
  document.getElementById('cat-id').value = c.id;
  document.getElementById('cat-name').value = c.name || '';
  document.getElementById('cat-description').value = c.description || '';
  modalShow('modal-cat');
}
function saveCat(e) {
  e.preventDefault();
  const id = document.getElementById('cat-id').value;
  const data = { name: document.getElementById('cat-name').value.trim(), description: document.getElementById('cat-description').value.trim() };
  const p = id ? apiPut('/api/menu/categories/' + id, data) : apiPost('/api/menu/categories', data);
  p.then(() => { modalHide('modal-cat'); showMsg(msg, 'Guardado correctamente.', 'success'); loadCategories(); loadDishes(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}
function delCat(id, name) {
  if (!confirm('¿Eliminar la categoría "' + name + '" y todos sus platos?')) return;
  apiDelete('/api/menu/categories/' + id)
    .then(() => { showMsg(msg, 'Categoría eliminada.', 'success'); loadCategories(); loadDishes(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}

function openDishForm() {
  document.getElementById('modal-dish-title').textContent = 'Nuevo plato';
  document.getElementById('dish-id').value = '';
  document.getElementById('dish-name').value = '';
  document.getElementById('dish-description').value = '';
  document.getElementById('dish-price').value = '';
  document.getElementById('dish-available').checked = true;
  fillCategorySelect();
  modalShow('modal-dish');
}
function editDish(id) {
  apiGet('/api/menu/dishes/' + id).then(d => {
    document.getElementById('modal-dish-title').textContent = 'Editar plato';
    document.getElementById('dish-id').value = d.id;
    document.getElementById('dish-name').value = d.name || '';
    document.getElementById('dish-description').value = d.description || '';
    document.getElementById('dish-price').value = d.price != null ? d.price : '';
    document.getElementById('dish-available').checked = d.available !== false;
    document.getElementById('dish-category-id').value = d.category_id || '';
    fillCategorySelect();
    modalShow('modal-dish');
  }).catch(err => showMsg(msg, err.message, 'error'));
}
function saveDish(e) {
  e.preventDefault();
  const id = document.getElementById('dish-id').value;
  const data = {
    name: document.getElementById('dish-name').value.trim(),
    description: document.getElementById('dish-description').value.trim(),
    price: parseFloat(document.getElementById('dish-price').value) || 0,
    category_id: parseInt(document.getElementById('dish-category-id').value, 10),
    available: document.getElementById('dish-available').checked
  };
  const p = id ? apiPut('/api/menu/dishes/' + id, data) : apiPost('/api/menu/dishes', data);
  p.then(() => { modalHide('modal-dish'); showMsg(msg, 'Plato guardado.', 'success'); loadDishes(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}
function delDish(id) {
  if (!confirm('¿Eliminar este plato?')) return;
  apiDelete('/api/menu/dishes/' + id)
    .then(() => { showMsg(msg, 'Plato eliminado.', 'success'); loadDishes(); })
    .catch(err => showMsg(msg, err.message, 'error'));
}

loadCategories();
loadDishes();
</script>
{% endblock %}
